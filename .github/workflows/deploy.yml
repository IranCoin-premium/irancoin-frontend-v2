name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd project && npm install --legacy-peer-deps && npm run build
      - run: |
          echo "project/dist:"; ls -la project/dist/ 2>&1 | head -20
          echo "---"; ls -la project/dist/public/ 2>&1 | head -20
          echo "--- root dist:"; ls -la dist/ 2>&1 | head -20
      - run: |
          # vite outputs to ../dist/public relative to project -> repo/dist/public, esbuild to project/dist/index.js
          # Gather both into dist/ for Pages
          mkdir -p dist
          if [ -d project/dist/public ]; then cp -r project/dist/public/* dist/ 2>/dev/null; fi
          if [ -d dist/public ]; then cp -r dist/public/* dist/ 2>/dev/null; fi
          ls -la dist/ | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
