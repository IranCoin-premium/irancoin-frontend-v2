name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd project && npm install --legacy-peer-deps && npm run build
      - run: ls -la project/dist/public/ 2>&1 || ls -la dist/ 2>&1 || true
      - run: rm -rf dist && mkdir -p dist && cp -r project/dist/public/* dist/ 2>/dev/null || cp -r dist.backup/* dist/ 2>/dev/null; ls -la dist/ | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
