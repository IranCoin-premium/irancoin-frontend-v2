<!--
  Style direction: «سکوتِ کوانت» — typography is a structural element: Space Grotesk for confident display,
  IBM Plex Sans for reading, and IBM Plex Mono for evidence metadata and market data.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="description" content="IranCoin Premium — financial intelligence for disciplined operators." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>IranCoin Premium — See before you act</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") document.documentElement.classList.add(saved);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
